<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BiH Slagalica</title>
<meta name="description" content="Složi kartu Bosne i Hercegovine! Online slagalica za djecu.">
<meta name="theme-color" content="#1e3a8a">
<meta property="og:type" content="website">
<meta property="og:title" content="BiH Slagalica">
<meta property="og:description" content="Složi kartu Bosne i Hercegovine! Online slagalica za djecu. Koliko brzo možeš?">
<meta property="og:url" content="https://hariszukanovic.github.io/bih-puzzle/">
<meta property="og:image" content="https://hariszukanovic.github.io/bih-puzzle/img/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="bar">
  <div class="brand">
    <img src="img/icon.svg" alt="" width="40" height="40">
    <div>
      <h1><span class="bih" aria-label="BiH"><span class="b">B</span><span class="i">i</span><span class="b">H</span></span> <span id="titleWord">Slagalica</span></h1>
      <p class="tagline" data-i18n="tagline">Složi kartu Bosne i Hercegovine!</p>
    </div>
  </div>

  <div class="controls">
    <div class="group pieces">
      <span class="label" data-i18n="pieces">Dijelovi</span>
      <button class="round" id="minus" aria-label="-">−</button>
      <input id="count" type="number" min="2" max="80" value="22" inputmode="numeric" aria-label="pieces">
      <button class="round" id="plus" aria-label="+">+</button>
    </div>

    <div class="group">
      <button class="chip" id="tCantons" aria-pressed="true"><span aria-hidden="true">🗺️</span> <span class="txt" data-i18n="cantons">Kantoni</span></button>
      <button class="chip" id="tCities" aria-pressed="true"><span aria-hidden="true">🏙️</span> <span class="txt" data-i18n="cities">Gradovi</span></button>
      <button class="chip" id="tHint" aria-pressed="true"><span aria-hidden="true">💡</span> <span class="txt" data-i18n="hint">Pomoć</span></button>
    </div>

    <div class="group seg" role="group">
      <span class="label" data-i18n="shape">Oblik</span>
      <button class="segbtn" id="shapeClassic" aria-pressed="true" data-i18n="shapeClassic">Klasični</button>
      <button class="segbtn" id="shapeWavy" aria-pressed="false" data-i18n="shapeWavy">Valoviti</button>
    </div>

    <div class="group seg" role="group">
      <span class="label" data-i18n="background">Pozadina</span>
      <button class="segbtn" id="bgMap" aria-pressed="true" data-i18n="bgMap">Karta</button>
      <button class="segbtn" id="bgFlag" aria-pressed="false" data-i18n="bgFlag">Zastava</button>
    </div>

    <div class="group">
      <button class="chip icon" id="fullscreen" aria-label="Fullscreen" hidden>⛶</button>
      <button class="chip icon" id="tSound" aria-pressed="true" aria-label="Zvuk">🔊</button>
      <div class="seg lang" role="group" aria-label="Jezik / Language">
        <button class="segbtn" id="langBs" aria-pressed="true">BS</button>
        <button class="segbtn" id="langEn" aria-pressed="false">EN</button>
      </div>
      <button class="chip icon" id="rankBtn" aria-label="Top 10">🏆</button>
      <button class="primary" id="newGame"><span aria-hidden="true">🔀</span> <span data-i18n="newGame">Nova igra</span></button>
    </div>
  </div>
</header>

<main id="stage">
  <canvas id="board"></canvas>
  <div class="status" aria-live="polite">
    <span><span data-i18n="placed">Složeno</span>: <b id="placed">0 / 22</b></span>
    <span>⏱ <b id="time">00:00</b></span>
  </div>
  <div class="loading" id="loading"><div class="spinner"></div><span data-i18n="loading">Režem slagalicu…</span></div>
  <canvas id="confetti"></canvas>
  <div class="win" id="win" hidden>
    <div class="card">
      <div class="trophy" aria-hidden="true">🏆</div>
      <h2 data-i18n="winTitle">Bravo!</h2>
      <p id="winText"></p>
      <div class="record" id="record" hidden>
        <p class="recordText" id="recordText"></p>
        <form class="nameRow" id="nameForm" autocomplete="off">
          <input id="playerName" maxlength="20" data-i18n-ph="namePlaceholder" placeholder="Tvoje ime (nije obavezno)">
          <button class="primary" type="submit" id="saveName" data-i18n="save">Sačuvaj</button>
        </form>
      </div>
      <div class="seg tabs" data-online hidden>
        <button class="segbtn" data-scope="global" aria-pressed="true"><span aria-hidden="true">🌍</span> <span data-i18n="scopeGlobal">Svi igrači</span></button>
        <button class="segbtn" data-scope="local" aria-pressed="false"><span aria-hidden="true">📱</span> <span data-i18n="scopeLocal">Ovaj uređaj</span></button>
      </div>
      <ol class="board" id="winBoard"></ol>
      <div class="share" id="shareRow">
        <span class="label" data-i18n="share">Podijeli:</span>
        <button class="sharebtn native" id="shareNative" hidden>📤 <span data-i18n="shareShort">Podijeli</span></button>
        <button class="sharebtn fb" data-net="facebook">Facebook</button>
        <button class="sharebtn wa" data-net="whatsapp">WhatsApp</button>
        <button class="sharebtn vb" data-net="viber">Viber</button>
        <button class="sharebtn x" data-net="x">X</button>
        <button class="sharebtn cp" data-net="copy">🔗 <span data-i18n="copyLink">Kopiraj link</span></button>
      </div>
      <div class="actions">
        <button class="primary" id="again" data-i18n="playAgain">Igraj ponovo</button>
        <button class="chip" id="harder" data-i18n="harder">Više dijelova</button>
        <button class="chip" id="look" data-i18n="look">Pogledaj kartu</button>
      </div>
    </div>
  </div>
  <div class="win" id="ranking" hidden>
    <div class="card">
      <div class="trophy" aria-hidden="true">🏆</div>
      <h2 data-i18n="ranking">Najbolja vremena</h2>
      <p id="rankingSub"></p>
      <div class="seg tabs" data-online hidden>
        <button class="segbtn" data-scope="global" aria-pressed="true"><span aria-hidden="true">🌍</span> <span data-i18n="scopeGlobal">Svi igrači</span></button>
        <button class="segbtn" data-scope="local" aria-pressed="false"><span aria-hidden="true">📱</span> <span data-i18n="scopeLocal">Ovaj uređaj</span></button>
      </div>
      <ol class="board" id="rankBoard"></ol>
      <div class="actions">
        <button class="primary" id="rankClose" data-i18n="close">Zatvori</button>
        <button class="chip" id="rankClear" data-i18n="clear">Obriši listu</button>
      </div>
    </div>
  </div>
</main>

<script src="js/mapdata.js"></script>
<script src="js/i18n.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/online.js"></script>
<script src="js/game.js"></script>
</body>
</html>
